name: "Set up droast"
description: >-
  Installs the Dockerfile Roast (droast) release binary that the label meta-test in
  test/dockerfiles drives, verified against its published digest.

runs:
  using: "composite"
  steps:
    # Keep the version in step with the dockerfile-roast rev in .pre-commit-config.yaml (the
    # toolchain test checks it); the digest is the asset's line in the release's sha256sums.txt.
    - name: Install droast
      shell: bash
      env:
        DROAST_VERSION: 1.7.0
        DROAST_SHA256: cadb963a040ba2e68641af764f794e5d4fb3371bb9b92255fa5027060b08ea6e
      run: |
        set -euo pipefail
        binary="${RUNNER_TEMP}/droast"
        curl -fsSL -o "${binary}" \
          "https://github.com/immanuwell/dockerfile-roast/releases/download/${DROAST_VERSION}/droast-linux-x86_64"
        echo "${DROAST_SHA256}  ${binary}" | sha256sum --check --strict -
        sudo install -m 0755 "${binary}" /usr/local/bin/droast
        droast --version
